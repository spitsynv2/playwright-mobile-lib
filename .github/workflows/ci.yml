name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22', '24']
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: install node v${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: npm ci
        run: npm ci
      - name: lint
        run: npm run lint
      - name: build, type-check, and unit tests
        run: npm test
      - name: coverage thresholds
        run: npm run test:coverage
      - name: packed tarball smoke test
        run: npm run test:pack
